# Backend in a container, Electron on the host. Start this first, then run
# `npm run dev:docker` in Frontend/frontend.
#
#   export LOCAL_APP_TOKEN=$(python -c "import uuid;print(uuid.uuid4())")
#   docker compose up --build
#
# The `version:` key is gone on purpose: Compose v2 ignores it and warns.

services:
  backend:
    build: ./Backend
    ports:
      # Loopback only. This backend has one weak credential and no rate
      # limiting; it is not something to expose on a LAN.
      - "127.0.0.1:8000:8000"
    # Match the host owner of the bind mounts on Linux, or the non-root user in
    # the image cannot write the workspace. Docker Desktop mediates ownership
    # itself, so the default is fine there.
    #
    # The GID defaults to 0 on purpose: the image's writable directories are
    # owned by root group and group-writable, which is what lets an ARBITRARY
    # uid run. Overriding the GID to something else takes that away — only do it
    # when the host files really need that group.
    user: "${GAMACHINE_UID:-1000}:${GAMACHINE_GID:-0}"
    volumes:
      - backend-data:/data
      # The Unity project the agent works on. Without this the container has no
      # files to read or write, so every file tool operates on an empty image.
      #
      # No default: `.` used to be one, which silently mounted the product's own
      # source tree — application code, Compose file, release scripts — writable
      # into the container. A workspace has to be chosen, not inherited.
      - ${GAMACHINE_WORKSPACE:?set GAMACHINE_WORKSPACE to the project the agent should work on}:/workspace
      # The backend source itself, read-only, so a host edit is the code that
      # runs. Without it the container serves whatever the last build copied in.
      - ./Backend/app:/app:ro
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      - DB_PATH=/data/unity_master_v3.db
      - REQUIRE_LOCAL_APP_TOKEN=1
      # THE thing that was missing. Electron mints a fresh token per launch and
      # hands it to the backend process it spawns; in Docker mode it spawns
      # nothing, so the container never learned the token and rejected every
      # request. Now both sides read this one variable. `:?` fails the run with
      # a readable message instead of starting a container that 401s forever.
      - LOCAL_APP_TOKEN=${LOCAL_APP_TOKEN:?set LOCAL_APP_TOKEN to the same value the Electron app will use}
      # The Unity Editor runs on the host, so the container's own localhost is
      # the wrong address.
      - UNITY_MCP_URL=${UNITY_MCP_URL:-http://host.docker.internal:8080/mcp}
      # Pairs with the read-only source mount below: an edit on the host reaches
      # the process, not just the container's filesystem.
      - UVICORN_RELOAD=1
    extra_hosts:
      # Docker Desktop resolves host.docker.internal already; Linux does not.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  backend-data:
